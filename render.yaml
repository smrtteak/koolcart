services:
  - type: web
    name: koolcart
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      # Set ONE AI option: GEMINI_API_KEY (free), ANTHROPIC_API_KEY, or AI_BASE_URL + AI_API_KEY
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Public demo: roll the shop back to the starter catalog every hour.
      - key: DEMO_RESET_HOURS
        value: "1"
      # Optional: require a passcode for the seller studio (share it with judges). Leave empty to keep it open.
      - key: SELLER_PASSCODE
        sync: false
