services:
  - type: web
    name: koolcart
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      # Shared database so every visitor sees the same shop (free Neon Postgres works). Without it, data resets on restart.
      - key: DATABASE_URL
        sync: false
      # Set ONE AI option: GEMINI_API_KEY (free), ANTHROPIC_API_KEY, or AI_BASE_URL + AI_API_KEY
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Protects the house account ("Koolcart", which owns the starter shelf). Everyone else sells under their own name.
      - key: SELLER_PASSCODE
        sync: false
